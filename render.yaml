# Flash Dashboard — Render deployment
# Infrastructure as code. One web service + one postgres instance.

services:
  - type: web
    name: flash-dashboard
    runtime: node
    plan: starter            # free plan sleeps; WS C2 needs persistent uptime → starter minimum
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /auth/me   # will 401 without token — that's fine, proves the server is up
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "3000"              # Render injects its own PORT; this is fallback only
      - key: DATABASE_URL
        fromDatabase:
          name: flash-db
          property: connectionString
      - key: DB_SSL
        value: "true"              # Render Postgres requires SSL
      - key: JWT_SECRET
        generateValue: true        # Render generates a strong random secret
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false                # set manually in Render dashboard — never commit real creds

databases:
  - name: flash-db
    plan: free
    databaseName: flash_dashboard
    user: flash_admin
